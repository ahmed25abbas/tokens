<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>P2P Peer Client (v3 seed/bridge)</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Optional: used to fetch GitHub token files without CORS pain -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    :root{
      --bg:#070b16;
      --panel:rgba(255,255,255,.04);
      --panel-2:rgba(255,255,255,.03);
      --line:rgba(255,255,255,.09);
      --line-2:rgba(255,255,255,.06);
      --text:#e5e7eb;
      --muted:#94a3b8;
      --brand:#7c3aed;
      --brand2:#06b6d4;
      --ok:#22c55e;
      --err:#ef4444;
      --warn:#f59e0b;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 400px at 10% -10%, rgba(124,58,237,.20), transparent 60%),
        radial-gradient(900px 500px at 95% 0%, rgba(6,182,212,.14), transparent 60%),
        linear-gradient(180deg,#030712,#0b1020);
      overflow:hidden;
    }

    .app{
      height:100%;
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:12px;
      padding:12px;
    }

    .panel,.main{
      border:1px solid var(--line);
      background:var(--panel);
      border-radius:18px;
      backdrop-filter: blur(10px);
      overflow:hidden;
      box-shadow: var(--shadow);
      min-width:0;
      min-height:0;
    }

    .panel{ display:flex; flex-direction:column; }
    .main{
      display:grid;
      grid-template-rows:auto auto 1fr auto;
      min-height:0;
    }

    .sec{
      padding:12px;
      border-bottom:1px solid var(--line-2);
    }
    .sec:last-child{border-bottom:none}

    .title{
      margin:0 0 8px;
      font-size:13px;
      letter-spacing:.03em;
      text-transform:uppercase;
      color:#dbeafe;
      opacity:.95;
      font-weight:700;
    }

    .row{display:flex; gap:8px; flex-wrap:wrap}
    .row > *{min-width:0}

    input,button{
      border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      font-size:13px;
      padding:10px 12px;
      background:rgba(255,255,255,.03);
      outline:none;
      transition:.16s ease;
    }
    input:focus{
      border-color: rgba(124,58,237,.7);
      box-shadow: 0 0 0 3px rgba(124,58,237,.16);
    }
    button{
      cursor:pointer;
      border:none;
      font-weight:600;
      background:linear-gradient(90deg,var(--brand),var(--brand2));
      box-shadow:0 6px 18px rgba(124,58,237,.2);
    }
    button:hover{filter:brightness(1.06)}
    button:active{transform:translateY(1px)}
    button.secondary{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:none;
    }
    button.danger{
      background:linear-gradient(90deg,#b91c1c,#ef4444);
    }
    button.ghost{
      background:transparent;
      border:1px dashed rgba(255,255,255,.16);
      box-shadow:none;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:8px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
      border-radius:12px;
      padding:10px 12px;
      font-size:12px;
      min-height:38px;
    }
    .statusDot{
      width:8px;height:8px;border-radius:999px;flex:0 0 auto;
      background:#64748b;
      box-shadow:0 0 0 5px rgba(100,116,139,.12);
    }
    .status.ok .statusDot{
      background:var(--ok);
      box-shadow:0 0 0 5px rgba(34,197,94,.14);
    }
    .status.err .statusDot{
      background:var(--err);
      box-shadow:0 0 0 5px rgba(239,68,68,.14);
    }
    .status.warn .statusDot{
      background:var(--warn);
      box-shadow:0 0 0 5px rgba(245,158,11,.14);
    }

    .chipRow{display:flex; gap:8px; flex-wrap:wrap}
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      border-radius:999px;
      padding:5px 10px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
      font-size:11px;
      color:#cbd5e1;
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .stat{
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:10px;
      background:var(--panel-2);
    }
    .stat .k{font-size:11px;color:var(--muted)}
    .stat .v{margin-top:4px;font-weight:700;font-size:14px}

    .searchWrap{display:flex; gap:8px}
    .searchWrap input{flex:1}

    .peerList{
      flex:1;
      overflow:auto;
      padding:8px;
    }
    .peer{
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:10px;
      margin-bottom:8px;
      background:rgba(255,255,255,.02);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      cursor:pointer;
      transition:.14s ease;
    }
    .peer:hover{background:rgba(255,255,255,.035)}
    .peer.active{
      border-color:rgba(124,58,237,.45);
      background:rgba(124,58,237,.14);
      box-shadow: inset 0 0 0 1px rgba(124,58,237,.15);
    }
    .peer .name{
      font-weight:700;
      font-size:13px;
      line-height:1.2;
    }
    .peer .sub{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      max-width:220px;
    }
    .badge{
      border-radius:999px;
      padding:4px 8px;
      border:1px solid rgba(255,255,255,.12);
      font-size:10px;
      white-space:nowrap;
      color:#dbeafe;
      background:rgba(255,255,255,.03);
    }

    .headerBar{
      padding:12px;
      border-bottom:1px solid var(--line-2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
    }
    .headerTitle{
      font-weight:700; font-size:15px;
    }
    .headerMeta{
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    }
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      padding:5px 9px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.02);
      font-size:11px;
      color:#dbeafe;
    }
    .hdrActions{
      display:flex; gap:8px; flex-wrap:wrap;
    }

    .videos{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:12px;
      border-bottom:1px solid var(--line-2);
    }
    .videoCard{
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      padding:8px;
      background:rgba(255,255,255,.02);
      min-width:0;
    }
    .videoTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:8px;
    }
    .videoTop .lbl{
      font-size:11px;
      color:var(--muted);
      letter-spacing:.02em;
    }
    .videoFrame{
      width:100%;
      aspect-ratio:1 / 1;
      border-radius:10px;
      overflow:hidden;
      background:#000;
      position:relative;
      border:1px solid rgba(255,255,255,.06);
    }
    .videoFrame video{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      background:#000;
      display:block;
    }
    .videoEmpty{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#94a3b8; font-size:12px;
      pointer-events:none;
    }
    .iconBtn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      border-radius:10px;
      padding:6px 9px;
      font-size:11px;
      color:var(--text);
      cursor:pointer;
    }

    .chatWrap{
      min-height:0;
      display:grid;
      grid-template-rows: 1fr auto;
    }

    .chatHistory{
      min-height:0;
      overflow:auto;
      padding:12px;
      background:
        linear-gradient(180deg, rgba(2,6,23,.35), rgba(2,6,23,.55));
    }

    .daySep{
      text-align:center;
      color:var(--muted);
      font-size:11px;
      margin:10px 0 12px;
      position:relative;
    }
    .daySep::before,.daySep::after{
      content:"";
      position:absolute;
      top:50%;
      width:32%;
      height:1px;
      background:rgba(255,255,255,.06);
    }
    .daySep::before{left:0}
    .daySep::after{right:0}

    .msg{
      display:flex;
      margin-bottom:10px;
      gap:8px;
    }
    .msg.me{justify-content:flex-end}
    .msg.system{justify-content:center}
    .msg.system .bubble{
      max-width:90%;
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      color:#cbd5e1;
      font-size:12px;
    }

    .bubble{
      max-width:min(78%, 650px);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      padding:8px 10px;
      box-shadow:0 4px 14px rgba(0,0,0,.12);
      min-width:140px;
    }
    .msg.me .bubble{
      background:linear-gradient(135deg, rgba(124,58,237,.22), rgba(6,182,212,.16));
      border-color:rgba(124,58,237,.26);
    }
    .msg.peer .bubble{
      background:rgba(255,255,255,.03);
    }

    .metaLine{
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      margin-bottom:4px;
      font-size:10px;
      color:#bfdbfe;
    }
    .metaLine .who{
      color:#dbeafe;
      font-weight:700;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .metaLine .time{
      color:var(--muted);
      flex:0 0 auto;
    }
    .msgText{
      white-space:pre-wrap;
      word-break:break-word;
      font-size:13px;
      line-height:1.35;
      color:var(--text);
    }

    .fileCard{
      margin-top:6px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:8px;
      background:rgba(255,255,255,.02);
    }
    .fileTop{
      display:flex; justify-content:space-between; gap:8px; align-items:center;
      font-size:12px;
    }
    .fileName{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .fileSize{color:var(--muted); font-size:11px; white-space:nowrap}
    .fileState{
      margin-top:6px; font-size:11px; color:var(--muted);
      display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
    }
    .fileActions{ display:flex; gap:6px; flex-wrap:wrap; }
    .miniBtn{
      padding:5px 8px;
      border-radius:8px;
      font-size:11px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.03);
      color:var(--text);
      cursor:pointer;
    }

    .composer{
      border-top:1px solid var(--line-2);
      padding:10px;
      display:grid;
      grid-template-columns: 1fr auto;
      gap:8px;
      background:rgba(2,6,23,.22);
    }
    .composerTop{
      display:flex; gap:8px; align-items:center;
      grid-column:1 / -1;
      flex-wrap:wrap;
    }
    .composer input[type="text"]{ width:100%; }
    .composerMain{
      display:flex; gap:8px;
      grid-column:1 / -1;
    }
    .composerMain input[type="text"]{ flex:1; }
    .composerFile{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    }
    .composer input[type="file"]{
      border:none;
      background:transparent;
      padding:0;
      font-size:12px;
    }

    .incomingBar{
      display:none;
      margin-top:8px;
      border:1px solid rgba(245,158,11,.28);
      background:rgba(245,158,11,.08);
      border-radius:12px;
      padding:10px;
      font-size:12px;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
    }
    .incomingBar.show{display:flex}

    .muted{color:var(--muted); font-size:12px}

    @media (max-width: 1024px){
      .app{
        grid-template-columns:1fr;
        grid-template-rows: 44% 56%;
      }
      .videos{
        grid-template-columns:1fr 1fr;
      }
    }
    @media (max-width: 760px){
      .videos{grid-template-columns:1fr}
      .hdrActions{width:100%}
      .hdrActions button{flex:1}
      .bubble{max-width:90%}
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="panel">
      <div class="sec">
        <div class="title">Status</div>
        <div class="chipRow">
          <span class="chip" id="seedChip">Seeds: 0</span>
          <span class="chip" id="peerChip">Peers: 0</span>
        </div>
        <div id="netStatus" class="status warn">
          <span class="statusDot"></span>
          <span id="netStatusText">Connecting…</span>
        </div>
      </div>

      <div class="sec">
        <div class="title">Identity</div>
        <div class="row">
          <input id="identityInput" placeholder="Your name" style="flex:1" />
        </div>
        <div class="row" style="margin-top:8px">
          <button onclick="saveIdentity()">Save</button>
          <button class="secondary" onclick="enableMedia()">Camera</button>
          <button class="secondary" onclick="autoLogin(true)">Reconnect</button>
          <button class="danger" onclick="logoutAll()">Offline</button>
        </div>
        <div id="idStatus" class="status">
          <span class="statusDot"></span>
          <span id="idStatusText">Offline</span>
        </div>

        <div id="incomingBar" class="incomingBar">
          <div id="incomingText">Incoming request</div>
          <div class="row" style="gap:6px">
            <button class="secondary" onclick="acceptIncoming('data')">Accept Chat</button>
            <button onclick="acceptIncoming('media')">Accept Call</button>
            <button class="danger" onclick="rejectIncoming()">Reject</button>
          </div>
        </div>
      </div>

      <div class="sec">
        <div class="title">Peers</div>
        <div class="searchWrap">
          <input id="peerSearch" placeholder="Search peers…" oninput="renderPeers()" />
          <button class="secondary" onclick="refreshPeersNow()">↻</button>
        </div>
        <div class="stats" style="margin-top:8px">
          <div class="stat"><div class="k">Seeds</div><div class="v" id="statSeeds">0</div></div>
          <div class="stat"><div class="k">Peers</div><div class="v" id="statPeers">0</div></div>
        </div>
      </div>

      <div id="peerList" class="peerList">
        <div class="muted">No peers found.</div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="headerBar">
        <div>
          <div class="headerTitle">P2P Chat & Calls</div>
          <div class="headerMeta">
            <span class="pill" id="selfPill">You: -</span>
            <span class="pill" id="selectedPill">Peer: none</span>
            <span class="pill" id="sessionPill">Session: idle</span>
          </div>
        </div>

        <div class="hdrActions">
          <button class="secondary" onclick="connectSelectedData()">Connect</button>
          <button onclick="dialSelectedMedia()">Call</button>
          <button class="danger" onclick="hangup()">Disconnect</button>
        </div>
      </div>

      <div class="videos">
        <div class="videoCard">
          <div class="videoTop">
            <div class="lbl">Local Camera</div>
            <button class="iconBtn" onclick="toggleFullscreen('localVideoFrame')">Fullscreen</button>
          </div>
          <div class="videoFrame" id="localVideoFrame" ondblclick="toggleFullscreen('localVideoFrame')">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="videoEmpty" id="localVideoHint">Camera off</div>
          </div>
        </div>

        <div class="videoCard">
          <div class="videoTop">
            <div class="lbl">Remote Camera</div>
            <button class="iconBtn" onclick="toggleFullscreen('remoteVideoFrame')">Fullscreen</button>
          </div>
          <div class="videoFrame" id="remoteVideoFrame" ondblclick="toggleFullscreen('remoteVideoFrame')">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="videoEmpty" id="remoteVideoHint">No video</div>
          </div>
        </div>
      </div>

      <div class="chatWrap">
        <div id="chatHistory" class="chatHistory">
          <div class="daySep">Today</div>
        </div>

        <div class="composer">
          <div class="composerTop">
            <div class="composerFile">
              <input id="fileInput" type="file" />
              <button class="secondary" onclick="sendSelectedFile()">Send File</button>
            </div>
            <span class="muted">Chat/file-share works after Connect or Call.</span>
          </div>

          <div class="composerMain">
            <input id="chatText" type="text" placeholder="Type a message…" />
            <button class="secondary" onclick="sendChat()">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>

<script>
/* =========================================================
   CONFIG / STATE
========================================================= */

const STARTUP_RELOAD_FLAG = "__p2p_peer_client_reloaded_once__";

// ===== Timers / intervals (DIVIDED BY 5) =====
const HEARTBEAT_MS = 3000 / 5;          // 600ms
const NETWORK_REFRESH_MS = 12000 / 5;   // 2400ms
const MAX_CONNECTED_SEEDS = 10;

// Token scan discovery
const TOKEN_SCAN_MAX = 999;
const TOKEN_SCAN_STOP_AFTER_CONSECUTIVE_MISSES = 10;
const TOKEN_SCAN_BACKOFF_MS = 9000 / 5; // 1800ms

// Poll / backoff sleeps (DIVIDED BY 5)
const POLL_TIMEOUT_S = 20 / 5;          // 4 seconds
const POLL_OFFLINE_SLEEP_MS = 500 / 5;  // 100ms
const POLL_ERROR_SLEEP_MS = 700 / 5;    // 140ms

// ICE refresh (DIVIDED BY 5)
const ICE_REFRESH_MS = 20000 / 5;       // 4000ms

// Reconnect grace (DIVIDED BY 5)
const RESTART_SESSION_DELAY_MS = 250 / 5; // 50ms
const PC_FAIL_GRACE_MS = 1200 / 5;        // 240ms

// File send throttle sleep (DIVIDED BY 5)
const FILE_SEND_THROTTLE_SLEEP_MS = 50 / 5; // 10ms

// Download blob revoke delay (DIVIDED BY 5)
const BLOB_REVOKE_MS = 30000 / 5; // 6000ms

// Internal repo (hidden from UI)
const REPO_CFG = { owner: "ahmed25abbas", repo: "tokens", branch: "main" };
const GITHUB_FETCH = { byToken: {} };

// Dedup sizes
const EVENT_DEDUP_MAX = 2000;
const MSG_DEDUP_MAX = 2000;

// Default ICE until we fetch from server
let RTC_CONFIG = {
  iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }]
};

const STATE = {
  seeds: [],
  connectedSeeds: [],
  seedPollLoops: new Map(),
  seedStreams: new Map(), // seedUrl -> EventSource

  discoveredNodeUrls: new Set(),

  // Identity:
  peerUid: "",
  peerName: "",
  myPeerKey: "",
  online: false,

  peersByKey: new Map(),
  selectedPeerKey: "",

  incomingCall: null,
  activeCallId: "",
  activePeerKey: "",
  activeSeedUrl: "",
  sessionMode: "idle",
  outgoingRequestedMode: "data",

  heartbeatTimer: null,
  networkTickTimer: null,
  iceTickTimer: null,

  localStream: null,
  remoteStream: null,
  pc: null,

  chatDc: null,
  fileDc: null,

  makingOffer: false,
  polite: false,
  pendingIce: [],

  fileRecv: {},
  fileSendBusy: false,

  seenEventIds: new LruSet(EVENT_DEDUP_MAX),
  seenMsgIds: new LruSet(MSG_DEDUP_MAX),
  seenTransferIds: new LruSet(MSG_DEDUP_MAX),

  chatHistory: [],

  tokenScan: { running:false }
};

/* =========================================================
   SMALL UTILS
========================================================= */
function $(id){ return document.getElementById(id); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function now(){ return Date.now(); }

function setStatus(elId, msg, type="ok"){
  const root = $(elId);
  const textEl = $(elId + "Text");
  if (!root || !textEl) return;
  root.className = "status " + (type || "ok");
  textEl.textContent = msg;
}

function safeName(s){ return String(s ?? "").trim() || "Unknown"; }

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function formatTime(ts){
  try { return new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
  catch { return ""; }
}
function formatBytes(n){
  const x = Number(n)||0;
  if (x < 1024) return `${x} B`;
  if (x < 1024*1024) return `${(x/1024).toFixed(1)} KB`;
  if (x < 1024*1024*1024) return `${(x/1024/1024).toFixed(1)} MB`;
  return `${(x/1024/1024/1024).toFixed(1)} GB`;
}

function noCacheUrl(url){
  const u = new URL(url, window.location.href);
  u.searchParams.set("_cb", `${Date.now()}-${Math.random().toString(36).slice(2,8)}`);
  return u.toString();
}

async function fetchJson(url, opts={}){
  const r = await fetch(url, { cache:"no-store", redirect:"follow", ...opts });
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("application/json") ? await r.json() : await r.text();
  if (!r.ok) {
    const msg = (body && typeof body === "object" && body.error?.message) ? body.error.message : (typeof body === "string" ? body : "");
    throw new Error(`HTTP ${r.status}${msg ? `: ${msg}` : ""}`);
  }
  return body;
}

async function safePlay(el){
  try {
    const p = el?.play?.();
    if (p && typeof p.then === "function") await p;
  } catch {}

/* =========================================================
   LRU SET (DEDUP)
========================================================= */
function LruSet(maxSize){
  this.maxSize = Math.max(100, maxSize|0);
  this.map = new Map();
}
LruSet.prototype.has = function(k){ return this.map.has(k); }
LruSet.prototype.add = function(k){
  if (!k) return;
  if (this.map.has(k)) { this.map.delete(k); this.map.set(k, 1); return; }
  this.map.set(k, 1);
  if (this.map.size > this.maxSize){
    const first = this.map.keys().next().value;
    this.map.delete(first);
  }
}

/* =========================================================
   INTERNAL SEED DISCOVERY (GitHub tokens) + known_nodes gossip
========================================================= */
function createSourceState(){ return { latestValue:"", lastChosenValue:"", previousValues:[] }; }
function createTokenMeta(){
  return { sources:{ puter:createSourceState() }, effectiveValue:"", fetchedAt:0, lastSourceUsed:"", lastReason:"" };
}
function getTokenMeta(tokenName){
  if (!GITHUB_FETCH.byToken[tokenName]) GITHUB_FETCH.byToken[tokenName] = createTokenMeta();
  return GITHUB_FETCH.byToken[tokenName];
}
function pushUniqueFront(arr, value, max=3){
  if (!value) return arr || [];
  const next = [value, ...(arr || []).filter(v => v !== value)];
  return next.slice(0, max);
}
function markSourceSeen(tokenName, value){
  const st = getTokenMeta(tokenName).sources.puter;
  st.latestValue = value;
  st.previousValues = pushUniqueFront(st.previousValues, value, 3);
}
function markSourceChosen(tokenName, value){
  getTokenMeta(tokenName).sources.puter.lastChosenValue = value;
}
function buildGithubUrls(owner, repo, branch, path){
  return { blobUrl: `https://github.com/${owner}/${repo}/blob/${branch}/${path}` };
}
function extractUrlFromTokenText(txt){
  const s = String(txt || "").trim();
  if (/^https?:\/\//i.test(s)) return s;
  try {
    const j = JSON.parse(s);
    if (j && typeof j === "object") {
      if (typeof j.url === "string" && /^https?:\/\//i.test(j.url.trim())) return j.url.trim();
      const stack = [j];
      while (stack.length) {
        const cur = stack.pop();
        if (!cur) continue;
        if (typeof cur === "string" && /^https?:\/\//i.test(cur.trim())) return cur.trim();
        if (Array.isArray(cur)) stack.push(...cur);
        else if (typeof cur === "object") stack.push(...Object.values(cur));
      }
    }
  } catch {}
  const m = s.match(/https?:\/\/[^\s"']+/i);
  return m ? m[0] : "";
}
function validateSeedUrl(rawText){
  const candidate = extractUrlFromTokenText(rawText);
  const normalized = String(candidate || "").trim().replace(/^["']|["']$/g, "").replace(/\/+$/, "");
  let u;
  try { u = new URL(normalized); } catch { throw new Error("Invalid URL"); }
  if (!/^https?:$/.test(u.protocol)) throw new Error("Invalid URL");
  return normalized;
}
function extractGitHubBlobText(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  let out = "";
  for (const s of doc.querySelectorAll("script")) {
    const t = s.textContent || "";
    const rawLines = t.match(/"rawLines"\s*:\s*(\[[\s\S]*?\])/);
    if (rawLines) {
      try {
        const lines = JSON.parse(rawLines[1]);
        if (Array.isArray(lines)) {
          out = lines.join("\n").trim();
          if (out) return out;
        }
      } catch {}
    }
  }
  const el =
    doc.querySelector('[data-testid="read-only-cursor-text-area"]') ||
    doc.querySelector('.react-blob-textarea') ||
    doc.querySelector('.blob-code-inner') ||
    doc.querySelector('.blob-code');
  if (el) out = (el.value || el.textContent || "").trim();
  return out || "";
}
async function fetchGithubFilePuter(blobUrl){
  if (!window.puter?.net?.fetch) throw new Error("No network");
  const res = await puter.net.fetch(noCacheUrl(blobUrl), {
    headers: {
      "User-Agent":"Mozilla/5.0",
      "Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
      "Cache-Control":"no-cache"
    }
  });
  if (!res.ok) throw new Error("No result");
  const html = await res.text();
  const txt = extractGitHubBlobText(html).trim();
  if (!txt) throw new Error("No result");
  return txt;
}
async function fetchTokenUrlPuterOnly(owner, repo, branch, tokenName){
  const urls = buildGithubUrls(owner, repo, branch, tokenName);
  const rawText = await fetchGithubFilePuter(urls.blobUrl);
  const url = validateSeedUrl(rawText);
  markSourceSeen(tokenName, url);

  const meta = getTokenMeta(tokenName);
  const prevEffective = meta.effectiveValue || "";
  meta.effectiveValue = url;
  meta.fetchedAt = Date.now();
  meta.lastSourceUsed = "puter";
  meta.lastReason = "puter_only";
  markSourceChosen(tokenName, url);

  return { tokenName, url, changed: !!prevEffective && prevEffective !== url };
}

async function helloSeed(url){
  const base = String(url || "").replace(/\/+$/,"");
  const t0 = performance.now();
  const j = await fetchJson(noCacheUrl(base + "/api/node/hello"));
  const latency = Math.round(performance.now() - t0);
  return {
    url: base,
    latency_ms: latency,
    cluster_node_id: j?.node?.cluster_node_id || null,
    worker_id: j?.node?.worker_id || null,
    peers_online: j?.node?.peers_online ?? null,
    raw: j
  };
}

function addDiscoveredSeedUrl(url){
  const u = String(url || "").trim().replace(/\/+$/,"");
  if (!/^https?:\/\//i.test(u)) return;
  STATE.discoveredNodeUrls.add(u);
}

function mergeKnownNodesIntoSeeds(knownNodes){
  if (!Array.isArray(knownNodes)) return;
  for (const n of knownNodes){
    const u = String(n?.url || "").trim().replace(/\/+$/,"");
    if (!/^https?:\/\//i.test(u)) continue;
    addDiscoveredSeedUrl(u);
  }
}

async function scanSeedsOnce(){
  const { owner, repo, branch } = REPO_CFG;
  const found = [];
  let missStreak = 0;

  for (let i = 1; i <= TOKEN_SCAN_MAX; i++) {
    const tokenName = `token${i}`;
    try {
      const tok = await fetchTokenUrlPuterOnly(owner, repo, branch, tokenName);
      const hello = await helloSeed(tok.url);
      found.push({ token_name: tokenName, token_index: i, ...hello });
      missStreak = 0;
    } catch {
      missStreak++;
      if (missStreak >= TOKEN_SCAN_STOP_AFTER_CONSECUTIVE_MISSES) break;
    }
  }
  return found;
}

async function discoverSeeds(){
  const results = await scanSeedsOnce();

  // Also try hinted nodes from known_nodes gossip
  const hintedUrls = Array.from(STATE.discoveredNodeUrls);
  const hintedHello = [];
  for (const u of hintedUrls){
    try {
      const hello = await helloSeed(u);
      hintedHello.push({ token_name: "hint", token_index: 0, ...hello });
    } catch {}
  }

  const all = [...results, ...hintedHello];
  const dedup = new Map();
  for (const n of all.sort((a,b)=>a.latency_ms-b.latency_ms)) {
    const key = (n.cluster_node_id && n.worker_id)
      ? `cw:${n.cluster_node_id}:${n.worker_id}`
      : `url:${n.url}`;
    if (!dedup.has(key)) dedup.set(key, n);
  }

  const unique = Array.from(dedup.values()).sort((a,b)=>a.latency_ms-b.latency_ms);
  STATE.seeds = unique;
  STATE.connectedSeeds = unique.slice(0, MAX_CONNECTED_SEEDS);

  for (const s of STATE.connectedSeeds) addDiscoveredSeedUrl(s.url);

  updateMiniStats();
  setStatus("netStatus",
    STATE.connectedSeeds.length ? `Connected to ${STATE.connectedSeeds.length} seed(s)` : "Disconnected",
    STATE.connectedSeeds.length ? "ok" : "warn"
  );
}

/* =========================================================
   SEED NETWORK HELPERS (failover + health)
========================================================= */
async function postToSeed(seedUrl, path, body){
  return await fetchJson(noCacheUrl(seedUrl.replace(/\/+$/,"") + path), {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
}
async function getFromSeed(seedUrl, path){
  return await fetchJson(noCacheUrl(seedUrl.replace(/\/+$/,"") + path));
}

function seedCandidates(preferred){
  const out = [];
  const p = (preferred || "").toString().trim().replace(/\/+$/,"");
  if (p && /^https?:\/\//i.test(p)) out.push(p);

  for (const s of STATE.connectedSeeds){
    if (!out.includes(s.url)) out.push(s.url);
  }

  for (const u of Array.from(STATE.discoveredNodeUrls).slice(0, 20)){
    if (!out.includes(u)) out.push(u);
  }

  return out;
}

async function requestWithFailover(method, path, body, preferredSeedUrl){
  const candidates = seedCandidates(preferredSeedUrl);
  let lastErr = null;
  for (const url of candidates){
    try {
      if (method === "GET") return { seedUrl:url, data: await getFromSeed(url, path) };
      return { seedUrl:url, data: await postToSeed(url, path, body) };
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("No reachable seeds");
}

/* =========================================================
   HEARTBEAT / PEERS LIST
========================================================= */
async function sendHeartbeatToSeed(seed){
  const known_nodes = Array.from(STATE.discoveredNodeUrls).slice(0, 80).map(url => ({ url }));
  return await postToSeed(seed.url, "/api/peer/heartbeat", {
    peer_uid: STATE.peerUid,
    peer_name: STATE.peerName,
    capabilities: {
      webrtc: true, audio: true, video: true, chat: true, file_transfer: true, datachannel: true
    },
    known_nodes
  });
}

async function sendHeartbeatAll(){
  if (!STATE.online || !STATE.connectedSeeds.length) return;

  const nextConnected = [];
  const tmpPeers = new Map();

  await Promise.all(STATE.connectedSeeds.map(async (seed) => {
    try {
      const j = await sendHeartbeatToSeed(seed);
      nextConnected.push(seed);

      if (j?.you?.peer_key) STATE.myPeerKey = String(j.you.peer_key);
      mergeKnownNodesIntoSeeds(j?.known_nodes || []);

      const peers = Array.isArray(j?.peers) ? j.peers : [];
      for (const p of peers){
        const pk = String(p?.peer_key || "").trim();
        if (!pk || pk === STATE.myPeerKey) continue;

        const cand = {
          peer_key: pk,
          name: String(p?.name || "").trim() || "Unknown",
          capabilities: p?.capabilities || {},
          home_node_url: String(p?.home_node_url || "").trim(),
          signaling_via_node: p?.signaling_via_node !== false,
          last_seen_ts: Number(p?.last_seen_ts || 0),
          sourceSeedUrl: seed.url
        };

        const cur = tmpPeers.get(pk);
        if (!cur) tmpPeers.set(pk, cand);
        else tmpPeers.set(pk, {
          ...cur,
          ...cand,
          name: (cand.last_seen_ts >= cur.last_seen_ts) ? cand.name : cur.name,
          home_node_url: cand.home_node_url || cur.home_node_url,
          last_seen_ts: Math.max(cur.last_seen_ts||0, cand.last_seen_ts||0)
        });
      }
    } catch {}
  }));

  if (!nextConnected.length) {
    setStatus("netStatus", "Disconnected", "err");
    return;
  }

  STATE.connectedSeeds = nextConnected;
  for (const s of nextConnected) addDiscoveredSeedUrl(s.url);

  const oldSel = STATE.selectedPeerKey;
  STATE.peersByKey = tmpPeers;
  if (oldSel && !STATE.peersByKey.has(oldSel)) STATE.selectedPeerKey = "";

  updateMiniStats();
  renderPeers();
  updateHeaderPills();

  if (STATE.online) {
    startAllStreams();
    startAllPollLoops();
  }
}

async function startHeartbeatLoop(){
  if (STATE.heartbeatTimer) clearInterval(STATE.heartbeatTimer);
  await sendHeartbeatAll();
  STATE.heartbeatTimer = setInterval(sendHeartbeatAll, HEARTBEAT_MS);
}
function stopHeartbeatLoop(){
  if (STATE.heartbeatTimer) clearInterval(STATE.heartbeatTimer);
  STATE.heartbeatTimer = null;
}

/* =========================================================
   EVENT TRANSPORTS: SSE first, poll fallback
========================================================= */
function startAllStreams(){
  stopAllStreams();
  for (const seed of STATE.connectedSeeds){
    startSeedStream(seed.url);
  }
}
function stopAllStreams(){
  for (const [seedUrl, es] of STATE.seedStreams.entries()){
    try { es.close(); } catch {}
  }
  STATE.seedStreams.clear();
}

function startSeedStream(seedUrl){
  if (STATE.seedStreams.has(seedUrl)) return;
  const url = seedUrl.replace(/\/+$/,"") + `/api/peer/stream?peer_uid=${encodeURIComponent(STATE.peerUid)}`;
  try{
    const es = new EventSource(noCacheUrl(url));
    STATE.seedStreams.set(seedUrl, es);

    es.addEventListener("events", async (e) => {
      try {
        const j = JSON.parse(e.data || "{}");
        const events = Array.isArray(j?.events) ? j.events : [];
        for (const ev of events){
          if (STATE.seenEventIds.has(ev?.event_id)) continue;
          STATE.seenEventIds.add(ev?.event_id);
          ev.__seed_url = seedUrl;
          await handleEvent(ev);
        }
      } catch {}
    });

    es.addEventListener("ping", () => {});
    es.onerror = () => {
      // poll loop keeps working; SSE may recover
    };
  } catch {}
}

/* Poll fallback loops */
function startAllPollLoops(){
  stopAllPollLoops();
  for (const seed of STATE.connectedSeeds) startSeedPollLoop(seed.url);
}
function stopAllPollLoops(){
  for (const [url, ctrl] of STATE.seedPollLoops.entries()) ctrl.running = false;
  STATE.seedPollLoops.clear();
}
function startSeedPollLoop(seedUrl){
  if (STATE.seedPollLoops.has(seedUrl)) return;
  const ctrl = { running:true };
  STATE.seedPollLoops.set(seedUrl, ctrl);

  (async () => {
    while (ctrl.running) {
      if (!STATE.online) { await sleep(POLL_OFFLINE_SLEEP_MS); continue; }
      try {
        const j = await getFromSeed(seedUrl, `/api/peer/poll?peer_uid=${encodeURIComponent(STATE.peerUid)}&timeout=${encodeURIComponent(POLL_TIMEOUT_S)}`);
        const events = Array.isArray(j?.events) ? j.events : [];
        for (const ev of events) {
          if (STATE.seenEventIds.has(ev?.event_id)) continue;
          STATE.seenEventIds.add(ev?.event_id);
          ev.__seed_url = seedUrl;
          await handleEvent(ev);
        }
      } catch {
        await sleep(POLL_ERROR_SLEEP_MS);
      }
    }
  })();
}

/* =========================================================
   CALL / CONNECT ACTIONS (backend uses peer_key)
========================================================= */
async function connectSelectedData(){ await dialPeer("data"); }
async function dialSelectedMedia(){ await dialPeer("media"); }

async function dialPeer(mode){
  try {
    if (!STATE.online) throw new Error("offline");
    if (!STATE.selectedPeerKey) throw new Error("select");
    if (!STATE.myPeerKey) throw new Error("no key yet");
    if (STATE.selectedPeerKey === STATE.myPeerKey) throw new Error("self");
    if (STATE.activeCallId) throw new Error("busy");

    if (mode === "media") await ensureMedia();

    STATE.outgoingRequestedMode = mode;

    const targetPeer = STATE.peersByKey.get(STATE.selectedPeerKey);
    const preferred = targetPeer?.home_node_url || STATE.connectedSeeds[0]?.url;

    const r = await requestWithFailover("POST", "/api/peer/invite", {
      caller_key: STATE.myPeerKey,
      callee_key: STATE.selectedPeerKey,
      session_kind: mode
    }, preferred);

    STATE.activeSeedUrl = r.seedUrl;
    STATE.activeCallId = r.data?.call_id || "";
    STATE.activePeerKey = STATE.selectedPeerKey;
    STATE.sessionMode = "connecting";
    updateHeaderPills();

    setStatus("idStatus", mode === "media" ? "Calling…" : "Connecting…", "ok");
    addSystemMessage(`${mode === "media" ? "Calling" : "Connecting to"} ${(targetPeer?.name || "peer")}`);
  } catch (e) {
    setStatus("idStatus", "Could not connect", "err");
  }
}

async function acceptIncoming(mode="data"){
  try {
    if (!STATE.incomingCall) throw new Error("none");
    if (mode === "media") await ensureMedia();

    const ev = STATE.incomingCall;
    const seedUrl = ev.__seed_url || STATE.connectedSeeds[0]?.url;

    await postToSeed(seedUrl, "/api/peer/respond", {
      peer_uid: STATE.peerUid,
      call_id: ev.call_id,
      action: "accept"
    });

    STATE.activeCallId = ev.call_id;
    STATE.activePeerKey = ev.from;
    STATE.activeSeedUrl = seedUrl;
    STATE.sessionMode = mode;
    updateHeaderPills();

    await createPc(true, ev.call_id, ev.from, mode);
    STATE.incomingCall = null;
    renderIncomingBar();

    setStatus("idStatus", mode === "media" ? "Call accepted" : "Chat connected", "ok");
    addSystemMessage(`${mode === "media" ? "Call" : "Chat"} accepted`);
  } catch (e) {
    setStatus("idStatus", "Could not accept", "err");
  }
}

async function rejectIncoming(){
  try {
    if (!STATE.incomingCall) throw new Error("none");
    const ev = STATE.incomingCall;
    const seedUrl = ev.__seed_url || STATE.connectedSeeds[0]?.url;

    await postToSeed(seedUrl, "/api/peer/respond", {
      peer_uid: STATE.peerUid,
      call_id: ev.call_id,
      action: "reject"
    });

    addSystemMessage(`Rejected request`);
    STATE.incomingCall = null;
    renderIncomingBar();
    setStatus("idStatus", "Request rejected", "warn");
  } catch (e) {
    setStatus("idStatus", "Could not reject", "err");
  }
}

async function hangup(){
  try {
    if (!STATE.activeCallId && !STATE.pc) {
      setStatus("idStatus", "No active session", "warn");
      return;
    }

    try {
      if (STATE.activeCallId) {
        await requestWithFailover("POST", "/api/peer/hangup", {
          peer_uid: STATE.peerUid,
          call_id: STATE.activeCallId,
          reason: "user_hangup"
        }, STATE.activeSeedUrl || STATE.connectedSeeds[0]?.url);
      }
    } catch {}

    await stopPc(true);
    await restartSessionAfterCallEnd();
    setStatus("idStatus", "Disconnected", "warn");
    addSystemMessage("Session ended");
  } catch (e) {
    setStatus("idStatus", "Could not disconnect", "err");
  }
}

function renderIncomingBar(){
  const bar = $("incomingBar");
  if (!STATE.incomingCall){ bar.classList.remove("show"); return; }
  const fromKey = STATE.incomingCall.from;
  const peer = STATE.peersByKey.get(fromKey);
  $("incomingText").textContent = `Incoming request from ${peer?.name || "peer"}`;
  bar.classList.add("show");
}

async function sendSignal(callId, signalType, payload){
  await requestWithFailover("POST", "/api/peer/signal", {
    peer_uid: STATE.peerUid,
    call_id: callId,
    signal_type: signalType,
    payload
  }, STATE.activeSeedUrl || STATE.connectedSeeds[0]?.url);
}

/* =========================================================
   EVENT HANDLING (server events)
========================================================= */
async function handleEvent(ev){
  const t = ev.type;

  if (t === "incoming_call") {
    STATE.incomingCall = ev;
    renderIncomingBar();
    setStatus("idStatus", "Incoming request", "warn");

    const peer = STATE.peersByKey.get(ev.from);
    addSystemMessage(`Incoming request from ${peer?.name || "peer"}`);
    return;
  }

  if (t === "call_outgoing") {
    STATE.activeCallId = ev.call_id;
    STATE.activePeerKey = ev.to;
    STATE.activeSeedUrl = ev.__seed_url || STATE.activeSeedUrl;
    STATE.sessionMode = "connecting";
    updateHeaderPills();
    return;
  }

  if (t === "call_response") {
    if (ev.action === "accept") {
      STATE.activeSeedUrl = ev.__seed_url || STATE.activeSeedUrl;
      const mode = STATE.outgoingRequestedMode || "data";
      STATE.sessionMode = mode;
      updateHeaderPills();
      setStatus("idStatus", mode === "media" ? "Connecting call…" : "Connecting chat…", "ok");

      if (!STATE.pc) await createPc(false, ev.call_id, STATE.activePeerKey, mode);
      const pc = STATE.pc;

      STATE.makingOffer = true;
      try {
        const offer = await pc.createOffer({
          offerToReceiveAudio: mode === "media",
          offerToReceiveVideo: mode === "media"
        });
        await pc.setLocalDescription(offer);
        await sendSignal(ev.call_id, "offer", pc.localDescription);
      } finally {
        STATE.makingOffer = false;
      }
      return;
    }

    if (ev.action === "reject") {
      setStatus("idStatus", "Rejected", "warn");
      addSystemMessage("Peer rejected the request");
      await stopPc(true);
      await restartSessionAfterCallEnd();
      return;
    }
  }

  if (t === "call_response_local") {
    if (ev.action === "reject" || ev.action === "accept") {
      STATE.incomingCall = null;
      renderIncomingBar();
    }
    if (ev.action === "reject") {
      await stopPc(true);
      await restartSessionAfterCallEnd();
    }
    return;
  }

  if (t === "signal") {
    await handleSignal(ev);
    return;
  }

  if (t === "hangup" || t === "hangup_local") {
    setStatus("idStatus", "Disconnected", "warn");
    addSystemMessage("Session ended");
    await stopPc(true);
    await restartSessionAfterCallEnd();
  }
}

/* =========================================================
   MEDIA / WEBRTC / DATA CHANNELS
========================================================= */
async function enableMedia(){
  try { await ensureMedia(); setStatus("idStatus", "Camera ready", "ok"); }
  catch { setStatus("idStatus", "Camera unavailable", "err"); }
}

async function ensureMedia(){
  if (STATE.localStream) { updateVideoHints(); return STATE.localStream; }
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("unsupported");

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
    video: { width:{ideal:720}, height:{ideal:720}, facingMode:"user" }
  });

  STATE.localStream = stream;
  $("localVideo").srcObject = stream;
  await safePlay($("localVideo"));
  updateVideoHints();
  return stream;
}

async function createPc(polite, callId, peerKey, mode="data"){
  if (STATE.pc) return STATE.pc;

  STATE.polite = !!polite;
  STATE.pendingIce = [];
  STATE.fileRecv = {};
  STATE.sessionMode = mode;
  updateHeaderPills();

  const pc = new RTCPeerConnection(RTC_CONFIG);
  STATE.pc = pc;

  STATE.remoteStream = new MediaStream();
  $("remoteVideo").srcObject = STATE.remoteStream;
  updateVideoHints();

  if (mode === "media") {
    await ensureMedia();
    for (const tr of (STATE.localStream?.getTracks() || [])) pc.addTrack(tr, STATE.localStream);
  }

  if (!polite) {
    STATE.chatDc = pc.createDataChannel("chat", { ordered:true });
    wireChatChannel(STATE.chatDc);

    STATE.fileDc = pc.createDataChannel("file", { ordered:true });
    wireFileChannel(STATE.fileDc);
  }

  pc.ondatachannel = (e) => {
    if (e.channel.label === "chat") { STATE.chatDc = e.channel; wireChatChannel(STATE.chatDc); }
    else if (e.channel.label === "file") { STATE.fileDc = e.channel; wireFileChannel(STATE.fileDc); }
  };

  pc.ontrack = async (e) => {
    if (e.streams && e.streams[0]) $("remoteVideo").srcObject = e.streams[0];
    else if (STATE.remoteStream) { STATE.remoteStream.addTrack(e.track); $("remoteVideo").srcObject = STATE.remoteStream; }
    updateVideoHints();
    await safePlay($("remoteVideo"));
  };

  pc.onicecandidate = async (e) => {
    if (!e.candidate || !STATE.activeCallId) return;
    try { await sendSignal(STATE.activeCallId, "ice", e.candidate); } catch {}
  };

  pc.onconnectionstatechange = async () => {
    if (pc.connectionState === "connected") {
      STATE.sessionMode = mode;
      updateHeaderPills();
      setStatus("idStatus", mode === "media" ? "In call" : "Connected", "ok");
      addSystemMessage(mode === "media" ? "Call connected" : "Chat connected");
      updateVideoHints();
      await safePlay($("remoteVideo"));
    }

    if (["failed","disconnected","closed"].includes(pc.connectionState)) {
      setTimeout(async () => {
        if (STATE.pc === pc && pc.connectionState !== "connected") {
          await stopPc(true);
          await restartSessionAfterCallEnd();
          setStatus("idStatus", "Disconnected", "warn");
          addSystemMessage("Connection lost");
        }
      }, PC_FAIL_GRACE_MS);
    }
  };

  return pc;
}

/* =========================================================
   CHAT CHANNEL + ACK + DEDUP
========================================================= */
function wireChatChannel(dc){
  dc.onopen = () => addSystemMessage("Chat channel ready");
  dc.onclose = () => addSystemMessage("Chat channel closed");
  dc.onerror = () => {};

  dc.onmessage = (e) => {
    try {
      const j = JSON.parse(e.data);

      if (j?.type === "chat-ack" && j?.msg_id){
        const item = findChatEntryById(j.msg_id);
        if (item && item.kind === "chat" && item.role === "me"){
          item.ack = "delivered";
          renderChatHistory();
        }
        return;
      }

      if (j?.type === "chat") {
        const msgId = String(j.msg_id || "");
        if (msgId && STATE.seenMsgIds.has(msgId)) return;
        if (msgId) STATE.seenMsgIds.add(msgId);

        const peer = STATE.peersByKey.get(STATE.activePeerKey) || { peer_key: STATE.activePeerKey, name: "Peer" };

        addChatEntry({
          id: msgId || `m-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
          kind: "chat",
          role: "peer",
          peer,
          who: peer.name,
          text: j.text || "",
          ts: Number(j.ts) || Date.now()
        });

        if (msgId){
          try { dc.send(JSON.stringify({ type:"chat-ack", msg_id: msgId, ts: Date.now() })); } catch {}
        }
      }
    } catch {}
  };
}

function sendChat(){
  const txt = ($("chatText").value || "").trim();
  if (!txt) return;

  if (!STATE.chatDc || STATE.chatDc.readyState !== "open") {
    setStatus("idStatus", "Connect first", "warn");
    return;
  }

  try {
    const msgId = `m-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
    const payload = { type:"chat", msg_id: msgId, text:txt, ts:Date.now() };
    STATE.chatDc.send(JSON.stringify(payload));

    addChatEntry({
      id: msgId,
      kind: "chat",
      role: "me",
      who: STATE.peerName,
      text: txt,
      ts: payload.ts,
      ack: "sending…"
    });

    $("chatText").value = "";
  } catch {
    setStatus("idStatus", "Could not send message", "err");
  }
}

/* =========================================================
   FILE CHANNEL + ACK + DEDUP
========================================================= */
function wireFileChannel(dc){
  dc.binaryType = "arraybuffer";
  dc.onopen = () => addSystemMessage("File sharing ready");
  dc.onclose = () => {};
  dc.onerror = () => {};

  dc.onmessage = async (e) => {
    if (typeof e.data === "string") {
      let j;
      try { j = JSON.parse(e.data); } catch { return; }

      if (j?.type === "file-ack" && j?.transfer_id){
        const item = findChatEntryById(j.transfer_id);
        if (item?.file) { item.file.state = "delivered"; renderChatHistory(); }
        return;
      }

      if (j.type === "file-meta") {
        const tid = String(j.transfer_id || "");
        if (!tid) return;
        if (STATE.seenTransferIds.has(tid)) return;
        STATE.seenTransferIds.add(tid);

        const msgId = tid;

        STATE.fileRecv[tid] = { meta: j, chunks: [], bytesReceived: 0, msgId };

        const peer = STATE.peersByKey.get(STATE.activePeerKey) || { peer_key: STATE.activePeerKey, name: "Peer" };
        addChatEntry({
          id: msgId,
          kind: "file",
          role: "peer",
          peer,
          who: peer.name,
          ts: Date.now(),
          file: {
            name: j.name,
            size: j.size,
            mime: j.mime || "application/octet-stream",
            state: "receiving…",
            blob: null
          }
        });
        return;
      }

      if (j.type === "file-end") {
        const tid = String(j.transfer_id || "");
        const rec = STATE.fileRecv[tid];
        if (!rec) return;

        const blob = new Blob(rec.chunks, { type: rec.meta.mime || "application/octet-stream" });

        const item = findChatEntryById(rec.msgId);
        if (item?.file) {
          item.file.blob = blob;
          item.file.state = "received";
        }

        delete STATE.fileRecv[tid];
        renderChatHistory();

        try { dc.send(JSON.stringify({ type:"file-ack", transfer_id: tid, ts: Date.now() })); } catch {}
        return;
      }

      return;
    }

    const activeTransfers = Object.values(STATE.fileRecv);
    if (!activeTransfers.length) return;

    const rec = activeTransfers[activeTransfers.length - 1];
    rec.chunks.push(e.data);
    rec.bytesReceived += (e.data.byteLength || 0);

    const item = findChatEntryById(rec.msgId);
    if (item?.file && rec.meta?.size) {
      const pct = Math.min(100, Math.floor((rec.bytesReceived / rec.meta.size) * 100));
      item.file.state = `receiving… ${pct}%`;
      if (pct === 100) item.file.state = "processing…";
      renderChatHistory();
    }
  };
}

async function sendSelectedFile(){
  try {
    const f = $("fileInput").files?.[0];
    if (!f) throw new Error("Select a file");
    if (!STATE.fileDc || STATE.fileDc.readyState !== "open") throw new Error("Not connected");
    if (STATE.fileSendBusy) throw new Error("Busy");

    STATE.fileSendBusy = true;

    const transferId = `t-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
    const CHUNK = 16 * 1024;

    addChatEntry({
      id: transferId,
      kind: "file",
      role: "me",
      who: STATE.peerName,
      ts: Date.now(),
      file: {
        name: f.name,
        size: f.size,
        mime: f.type || "application/octet-stream",
        state: "sending… 0%",
        blob: f
      }
    });

    STATE.fileDc.send(JSON.stringify({
      type: "file-meta",
      transfer_id: transferId,
      name: f.name,
      size: f.size,
      mime: f.type || "application/octet-stream",
      chunk_size: CHUNK
    }));

    let offset = 0;
    while (offset < f.size) {
      while (STATE.fileDc.bufferedAmount > 2 * 1024 * 1024) await sleep(FILE_SEND_THROTTLE_SLEEP_MS);
      const chunk = await f.slice(offset, offset + CHUNK).arrayBuffer();
      STATE.fileDc.send(chunk);
      offset += chunk.byteLength;

      const pct = Math.min(100, Math.floor((offset / f.size) * 100));
      const item = findChatEntryById(transferId);
      if (item?.file) { item.file.state = `sending… ${pct}%`; renderChatHistory(); }
    }

    STATE.fileDc.send(JSON.stringify({ type:"file-end", transfer_id: transferId }));

    const item = findChatEntryById(transferId);
    if (item?.file) { item.file.state = "sent (awaiting ack…)"; renderChatHistory(); }

    $("fileInput").value = "";
  } catch {
    setStatus("idStatus", "Could not send file", "err");
  } finally {
    STATE.fileSendBusy = false;
  }
}

/* =========================================================
   SIGNAL HANDLING
========================================================= */
async function handleSignal(ev){
  const { call_id, signal_type, payload } = ev;

  if (!STATE.pc) {
    const activeMatch = STATE.activeCallId && STATE.activeCallId === call_id;
    if (!activeMatch) return;
    const mode =
      (STATE.sessionMode === "connecting")
        ? (STATE.outgoingRequestedMode || "data")
        : (STATE.sessionMode || "data");
    await createPc(false, call_id, STATE.activePeerKey, mode);
  }

  const pc = STATE.pc;
  if (!pc) return;

  if (signal_type === "offer") {
    const offerCollision = STATE.makingOffer || pc.signalingState !== "stable";
    const ignoreOffer = !STATE.polite && offerCollision;
    if (ignoreOffer) return;

    await pc.setRemoteDescription(new RTCSessionDescription(payload));
    await flushPendingIce();

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendSignal(call_id, "answer", pc.localDescription);
    return;
  }

  if (signal_type === "answer") {
    await pc.setRemoteDescription(new RTCSessionDescription(payload));
    await flushPendingIce();
    return;
  }

  if (signal_type === "ice") {
    if (!pc.remoteDescription) STATE.pendingIce.push(payload);
    else {
      try { await pc.addIceCandidate(new RTCIceCandidate(payload)); } catch {}
    }
  }
}

async function flushPendingIce(){
  if (!STATE.pc || !STATE.pc.remoteDescription) return;
  const arr = [...STATE.pendingIce];
  STATE.pendingIce = [];
  for (const c of arr) {
    try { await STATE.pc.addIceCandidate(new RTCIceCandidate(c)); } catch {}
  }
}

async function stopPc(resetCallState=true){
  try {
    if (STATE.pc) {
      try { STATE.pc.ontrack = null; } catch {}
      try { STATE.pc.ondatachannel = null; } catch {}
      try { STATE.pc.onicecandidate = null; } catch {}
      try { STATE.pc.close(); } catch {}
    }
  } catch {}

  STATE.pc = null;
  STATE.chatDc = null;
  STATE.fileDc = null;
  STATE.pendingIce = [];
  STATE.fileRecv = {};
  STATE.fileSendBusy = false;
  STATE.makingOffer = false;
  STATE.polite = false;

  if (STATE.remoteStream) {
    try { STATE.remoteStream.getTracks().forEach(t => t.stop()); } catch {}
  }
  STATE.remoteStream = null;
  $("remoteVideo").srcObject = null;

  if (resetCallState) {
    STATE.activeCallId = "";
    STATE.activePeerKey = "";
    STATE.activeSeedUrl = "";
    STATE.incomingCall = null;
    STATE.sessionMode = "idle";
  }

  renderIncomingBar();
  updateHeaderPills();
  updateVideoHints();
}

/* =========================================================
   SESSION RESTART AFTER END
========================================================= */
async function restartSessionAfterCallEnd(){
  if (!STATE.online) return;
  try {
    STATE.online = false;
    stopHeartbeatLoop();
    stopAllStreams();
    stopAllPollLoops();
    await sleep(RESTART_SESSION_DELAY_MS);
    STATE.online = true;
    await startHeartbeatLoop();
    startAllStreams();
    startAllPollLoops();
    setStatus("idStatus", `Online as ${STATE.peerName}`, "ok");
  } catch {
    setStatus("idStatus", "Disconnected", "err");
  }
}

/* =========================================================
   BOOT
========================================================= */
async function startSeedScanLoop(){
  if (STATE.tokenScan.running) return;
  STATE.tokenScan.running = true;

  (async () => {
    while (STATE.tokenScan.running) {
      try {
        await discoverSeeds();
        if (STATE.online) {
          startAllStreams();
          startAllPollLoops();
          await sendHeartbeatAll();
        }
      } catch {
        setStatus("netStatus", "Disconnected", "err");
      }
      await sleep(TOKEN_SCAN_BACKOFF_MS);
    }
  })();
}
function stopSeedScanLoop(){ STATE.tokenScan.running = false; }

async function boot(){
  const continueBoot = await clearCachesOnceAndReload();
  if (!continueBoot) return;

  ensureIdentity();
  updateHeaderPills();
  renderChatHistory();
  updateVideoHints();

  if (!window.isSecureContext) setStatus("idStatus", "Use HTTPS for camera", "warn");

  startSeedScanLoop();
  try { await discoverSeeds(); } catch {}

  await autoLogin(false);

  if (STATE.networkTickTimer) clearInterval(STATE.networkTickTimer);
  STATE.networkTickTimer = setInterval(async () => {
    try {
      const before = new Set(STATE.connectedSeeds.map(n => n.url));
      await discoverSeeds();
      const after = new Set(STATE.connectedSeeds.map(n => n.url));
      const changed = before.size !== after.size || [...before].some(u => !after.has(u));
      if (changed && STATE.online) {
        startAllStreams();
        startAllPollLoops();
        await sendHeartbeatAll();
      }
    } catch {}
  }, NETWORK_REFRESH_MS);

  $("chatText").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });
}

window.addEventListener("beforeunload", () => {
  stopHeartbeatLoop();
  stopIceLoop();
  stopAllStreams();
  stopAllPollLoops();
  stopSeedScanLoop();
});

boot();
</script>
